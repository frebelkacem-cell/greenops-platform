global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'greenops-local'
    env: 'docker'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'traefik'
    static_configs:
      - targets: ['reverse-proxy:8082']
    metrics_path: /metrics

  - job_name: 'api-centrale'
    scrape_interval: 5s
    static_configs:
      - targets: ['api-centrale:3000']
    metrics_path: /metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
