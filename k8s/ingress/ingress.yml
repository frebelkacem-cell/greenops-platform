apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greenops-ingress
  namespace: greenops
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.greenops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-supervision
                port:
                  number: 80

    - host: admin.greenops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tour-de-controle
                port:
                  number: 80

    - host: api.greenops.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-centrale
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greenops-monitoring-ingress
  namespace: greenops-monitoring
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.greenops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    - host: prometheus.greenops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
