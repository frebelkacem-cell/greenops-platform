apiVersion: v1
kind: ConfigMap
metadata:
  name: greenops-api-config
  namespace: greenops
data:
  DB_HOST:        "database"
  DB_PORT:        "5432"
  REDIS_HOST:     "cache"
  REDIS_PORT:     "6379"
  JWT_EXPIRES_IN: "1h"
  NODE_ENV:       "production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: greenops-sim-config
  namespace: greenops
data:
  API_URL:         "http://api-centrale:3000"
  SIM_INTERVAL_MS: "5000"
  SIM_USER:        "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: greenops-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: 'greenops-k8s'
        env: 'kubernetes'

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['greenops']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: 'api-centrale'
        static_configs:
          - targets: ['api-centrale.greenops.svc.cluster.local:3000']
        metrics_path: /metrics
