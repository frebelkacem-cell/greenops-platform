# â”€â”€ Simulateur â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulateur
  namespace: greenops
  labels:
    app: simulateur
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulateur
  template:
    metadata:
      labels:
        app: simulateur
        tier: backend
    spec:
      containers:
        - name: simulateur
          image: ghcr.io/frebelkacem-cell/greenops-simulateur:latest
          envFrom:
            - configMapRef:
                name: greenops-sim-config
          env:
            - name: SIM_PASS
              valueFrom:
                secretKeyRef:
                  name: greenops-jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
