name: greenops

services:

  # ── Traefik Reverse Proxy ─────────────────────────────
  reverse-proxy:
    image: traefik:v3.0
    container_name: greenops-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "8082:8082"
    volumes:
      - ./proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────
  database:
    image: postgres:16-alpine
    container_name: greenops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: greenops-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Centrale (Node.js) ────────────────────────────
  api-centrale:
    build:
      context: ./api-centrale
      dockerfile: Dockerfile
    container_name: greenops-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_USER:        ${DB_USER}
      DB_PASSWORD:    ${DB_PASSWORD}
      DB_NAME:        ${DB_NAME}
      DB_HOST:        database
      DB_PORT:        ${DB_PORT:-5432}
      REDIS_HOST:     cache
      REDIS_PORT:     ${REDIS_PORT:-6379}
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      NODE_ENV:       production
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Dashboard Supervision ─────────────────────────────
  dashboard-supervision:
    build:
      context: ./dashboard-supervision
      dockerfile: Dockerfile
    container_name: greenops-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api-centrale:
        condition: service_healthy
    networks:
      - frontend-net

  # ── Tour de Contrôle Admin ────────────────────────────
  tour-de-controle:
    build:
      context: ./tour-de-controle
      dockerfile: Dockerfile
    container_name: greenops-admin
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      api-centrale:
        condition: service_healthy
    networks:
      - frontend-net

  # ── Simulateur ────────────────────────────────────────
  simulateur:
    build:
      context: ./simulateur
      dockerfile: Dockerfile
    container_name: greenops-sim
    restart: unless-stopped
    environment:
      API_URL:         http://api-centrale:3000
      SIM_INTERVAL_MS: ${SIM_INTERVAL_MS:-5000}
      SIM_USER:        ${SIM_USER:-admin}
      SIM_PASS:        ${SIM_PASS:-admin}
    depends_on:
      api-centrale:
        condition: service_healthy
    networks:
      - backend-net

  # ── Prometheus ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: greenops-prometheus
    restart: unless-stopped
    ports:
      - "3004:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Grafana ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: greenops-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-greenops_grafana}
      GF_USERS_ALLOW_SIGN_UP:     "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Node Exporter ─────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: greenops-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
    name: greenops-frontend
  backend-net:
    driver: bridge
    name: greenops-backend

volumes:
  postgres-data:
    name: greenops-postgres-data
  redis-data:
    name: greenops-redis-data
  prometheus-data:
    name: greenops-prometheus-data
  grafana-data:
    name: greenops-grafana-data
